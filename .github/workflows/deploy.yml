name: Deploy React para Hostgator
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: 🏗️ Build & 🚀 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Obter código mais recente
      uses: actions/checkout@v4

    - name: 🟢 Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: 📦 Instalar dependências
      run: npm ci

    - name: � Criar .env.production com variáveis do Supabase
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      run: |
        cat > .env.production <<EOF
        VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
        EOF
        echo "✅ .env.production criado:"
        echo "  VITE_SUPABASE_URL      = $(echo -n "$VITE_SUPABASE_URL" | head -c 30)..."
        echo "  VITE_SUPABASE_ANON_KEY = $(echo -n "$VITE_SUPABASE_ANON_KEY" | head -c 15)..."

    - name: �🛠️ Build do Projeto
      run: npm run build

    - name: 📂 Sincronizar Dist com o Servidor
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./dist/
        server-dir: ./gerador.eixoconsorcios.com.br/
        dangerous-clean-slate: true
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
